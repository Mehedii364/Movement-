name: Android CI / Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --continue
          else
            gradle testDebugUnitTest --continue
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Validate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "::error::Generated APK is suspiciously small (${FILE_SIZE} bytes)"
            exit 1
          fi

          echo "Found valid APK: $APK_PATH (Size: $FILE_SIZE bytes)"
          unzip -t "$APK_PATH" > /dev/null
          echo "APK archive integrity verified with unzip."

          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          HASH_OUT=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH_DL=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')

          if [ "$HASH_OUT" != "$HASH_DL" ]; then
            echo "::error::SHA256 mismatch between destination APKs"
            exit 1
          fi

          echo "SHA256: $HASH_OUT"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "sha256=$HASH_OUT" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 14

      - name: Commit Debug APK to Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk
          git diff --staged --quiet || (git commit -m "build: update debug APK [skip ci]" && git push)
